apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticketbuddy
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        command: ["redis-server", "--requirepass", "yourStrong@Passw0rd"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "yourStrong@Passw0rd", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
