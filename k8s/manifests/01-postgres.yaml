apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ticketbuddy
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: metrics
    port: 9187
    targetPort: 9187
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: ticketbuddy
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:latest
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: YourStrong@Passw0rd
        - name: POSTGRES_DB
          value: TicketBuddy
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-d", "TicketBuddy", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:latest
        env:
        - name: DATA_SOURCE_NAME
          value: postgresql://postgres:YourStrong@Passw0rd@localhost:5432/TicketBuddy?sslmode=disable
        ports:
        - name: metrics
          containerPort: 9187
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
