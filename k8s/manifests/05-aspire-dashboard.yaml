apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: ticketbuddy
spec:
  selector:
    app: aspire-dashboard
  type: NodePort
  ports:
  - name: ui
    port: 18888
    targetPort: 18888
    nodePort: 30888
  - name: otlp
    port: 18889
    targetPort: 18889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-dashboard
  template:
    metadata:
      labels:
        app: aspire-dashboard
    spec:
      containers:
      - name: aspire-dashboard
        image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
        env:
        - name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS
          value: "true"
        ports:
        - containerPort: 18888
        - containerPort: 18889
