apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: ticketbuddy
spec:
  selector:
    app: ui
  type: NodePort
  ports:
  - port: 5173
    targetPort: 5173
    nodePort: 30173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: ticketbuddy-ui:local
        imagePullPolicy: Never
        env:
        - name: USE_COMPOSE_ENV
          value: "true"
        ports:
        - containerPort: 5173
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
