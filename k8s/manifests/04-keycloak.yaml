apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ticketbuddy
spec:
  selector:
    app: keycloak
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: ticketbuddy-keycloak:local
        imagePullPolicy: Never
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -ex
          /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import
          /opt/keycloak/bin/kc.sh start-dev
        env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: admin
        - name: KK_TO_RMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: KK_TO_RMQ_VHOST
          value: /
        - name: KK_TO_RMQ_USERNAME
          value: guest
        - name: KK_TO_RMQ_PASSWORD
          value: guest
        - name: KC_HEALTH_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 12
