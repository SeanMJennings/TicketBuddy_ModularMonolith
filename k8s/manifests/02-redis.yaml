apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticketbuddy
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: metrics
    port: 9121
    targetPort: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        command: ["redis-server", "--requirepass", "yourStrong@Passw0rd"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "yourStrong@Passw0rd", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        env:
        - name: REDIS_ADDR
          value: redis://localhost:6379
        - name: REDIS_PASSWORD
          value: yourStrong@Passw0rd
        ports:
        - name: metrics
          containerPort: 9121
