apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ticketbuddy
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  type: NodePort
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 30672
  - name: prometheus
    port: 15692
    targetPort: 15692
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: masstransit/rabbitmq
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: guest
        - name: RABBITMQ_DEFAULT_PASS
          value: guest
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus || true"]
        ports:
        - containerPort: 5672
        - containerPort: 15672
        - name: prometheus
          containerPort: 15692
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
