apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ticketbuddy
spec:
  selector:
    app: api
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ticketbuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ticketbuddy-api:local
        imagePullPolicy: Never
        env:
        - name: ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: http://+:8080
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
